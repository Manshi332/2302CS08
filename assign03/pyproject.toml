[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walletlab"
version = "1.0.0"
description = "Educational wallet: Ed25519 keys, addresses, canonical transactions, signatures (Assignment 3)"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
walletlab = "walletlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
