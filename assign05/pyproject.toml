[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chainlab"
version = "1.0.0"
description = "Assignment 5: blocks, toy Proof of Work, forks and reorganisation on a UTXO ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
chainlab = "chainlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
