[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "utxolab"
version = "1.0.0"
description = "Assignment 4: in-memory UTXO ledger, transaction validator and wallet builder"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
utxolab = "utxolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
